<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#f8f5fb">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="default">

<meta name="apple-mobile-web-app-title"
content="To-Do List">

<link rel="icon"
      type="image/png"
      href="favicon.png">

<link rel="apple-touch-icon"
      href="apple-touch-icon.png">

<link rel="manifest"
      href="manifest.json">

<title>To-Do List</title>


<style>

/* =========================================
   BASIC
========================================= */

* {
    box-sizing: border-box;
}

html {

    width: 100%;
    height: 100%;

    background: #f8f5fb;
}


body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background:
        linear-gradient(
            145deg,
            #fdf9fc 0%,
            #f4f0fa 45%,
            #eef5f4 100%
        );

    color: #514c58;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;

    overflow: hidden;
}


/* =========================================
   APP
========================================= */

.app {

    width: 100%;

    min-height: 100dvh;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    padding:
        calc(env(safe-area-inset-top) + 30px)
        18px
        calc(env(safe-area-inset-bottom) + 20px)
        18px;
}


.content {

    width: 100%;

    max-width: 540px;
}


/* =========================================
   HEADER
========================================= */

.header {

    text-align: center;

    margin-bottom: 24px;
}


.icon {

    font-size: 42px;

    line-height: 1;

    margin-bottom: 12px;
}


.title {

    margin: 0;

    font-size: 34px;

    font-weight: 750;

    letter-spacing: -0.5px;

    color: #514c58;
}


.subtitle {

    margin-top: 7px;

    font-size: 12px;

    color: #9993a0;

    letter-spacing: 1.5px;
}


/* =========================================
   CATEGORY BAR
========================================= */

.category-bar {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;

    margin-bottom: 14px;
}


.category {

    min-width: 0;

    padding:
        14px
        7px;

    border-radius: 17px;

    border:
        1px solid
        rgba(120,110,130,0.10);

    background:
        rgba(255,255,255,0.72);

    color: #9a95a0;

    text-align: center;

    cursor: pointer;

    box-shadow:
        0 5px 18px
        rgba(100,90,110,0.06);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}


.category.selected {

    color: #5e5865;

    box-shadow:
        0 7px 22px
        rgba(100,90,110,0.10);

    border-color:
        rgba(120,110,130,0.20);
}


.category:nth-child(1).selected {

    background: #eee5fa;
}


.category:nth-child(2).selected {

    background: #e4f1f8;
}


.category:nth-child(3).selected {

    background: #e4f4ed;
}

.category:nth-child(4).selected {

    background: #f8eadc;
}


.category:active {

    transform:
        scale(0.96);
}


.category-name {

    font-size: 13px;

    font-weight: 650;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.category-count {

    margin-top: 5px;

    font-size: 9px;

    color: #aaa5af;

    letter-spacing: 0.5px;
}


/* =========================================
   CATEGORY EDITOR
========================================= */

.category-editor {

    display: none;

    margin-bottom: 12px;

    gap: 7px;
}


.category-editor.visible {

    display: flex;
}


.category-input {

    flex: 1;

    min-width: 0;

    padding:
        12px
        13px;

    border:
        1px solid
        #ddd6e3;

    border-radius: 14px;

    outline: none;

    background:
        rgba(255,255,255,0.85);

    color: #57515e;

    font-family: inherit;

    font-size: 14px;

    box-shadow:
        0 4px 15px
        rgba(100,90,110,0.05);
}


.category-input:focus {

    border-color:
        #cbbbdc;
}


.category-save {

    padding:
        0
        16px;

    border: none;

    border-radius: 14px;

    background: #ddd0ed;

    color: #51485c;

    font-weight: 650;

    font-family: inherit;
}


.category-save:active {

    transform:
        scale(0.96);
}


/* =========================================
   CATEGORY HINT
========================================= */

.category-hint {

    text-align: center;

    margin-bottom: 13px;

    font-size: 10px;

    color: #aaa4ae;
}


/* =========================================
   CURRENT CATEGORY
========================================= */

.current-category {

    margin-bottom: 9px;

    font-size: 11px;

    color: #aaa3af;

    letter-spacing: 1.2px;

    text-transform: uppercase;
}


/* =========================================
   ADD TASK
========================================= */

.add-card {

    display: flex;

    gap: 9px;

    margin-bottom: 15px;
}


.task-input {

    flex: 1;

    min-width: 0;

    padding:
        15px
        15px;

    border:
        1px solid
        #e1dbe5;

    border-radius: 17px;

    outline: none;

    background:
        rgba(255,255,255,0.78);

    color: #514d55;

    font-family: inherit;

    font-size: 16px;

    box-shadow:
        0 6px 22px
        rgba(100,90,110,0.06);
}


.task-input::placeholder {

    color: #b7b1ba;
}


.task-input:focus {

    border-color:
        #cfc1d8;

    background:
        rgba(255,255,255,0.92);
}


.add-button {

    width: 54px;

    border: none;

    border-radius: 17px;

    background: #d9c7e8;

    color: #564a60;

    font-size: 27px;

    cursor: pointer;

    box-shadow:
        0 6px 18px
        rgba(120,100,130,0.12);

    transition:
        transform 0.15s ease;
}


.add-button:active {

    transform:
        scale(0.93);
}


/* =========================================
   TASK LIST
========================================= */

.task-list {

    display: flex;

    flex-direction: column;

    gap: 9px;

    max-height:
        calc(
            100dvh - 290px
        );

    overflow-y: auto;

    padding-bottom: 20px;

    scrollbar-width: none;
}


.task-list::-webkit-scrollbar {

    display: none;
}


/* =========================================
   TASK
========================================= */

.task {

    display: flex;

    align-items: center;

    gap: 14px;

    padding:
        15px
        16px;

    border-radius: 18px;

    background:
        rgba(255,255,255,0.76);

    border:
        1px solid
        rgba(150,140,155,0.10);

    box-shadow:
        0 7px 22px
        rgba(100,90,110,0.06);

    animation:
        taskAppear 0.2s ease;
}


@keyframes taskAppear {

    from {

        opacity: 0;

        transform:
            translateY(5px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }
}


/* =========================================
   CHECKBOX
========================================= */

.checkbox {

    width: 26px;

    height: 26px;

    flex-shrink: 0;

    border-radius: 50%;

    border:
        2px solid
        #c9bed1;

    background:
        #faf7fc;

    cursor: pointer;

    display: flex;

    justify-content: center;

    align-items: center;

    transition:
        background 0.15s ease,
        border 0.15s ease,
        transform 0.15s ease;
}


.checkbox:active {

    transform:
        scale(0.88);
}


.checkmark {

    font-size: 15px;

    color: #65566e;

    opacity: 0;

    transform:
        scale(0.5);

    transition:
        opacity 0.15s ease,
        transform 0.15s ease;
}


/* =========================================
   TASK TEXT
========================================= */

.task-text {

    flex: 1;

    min-width: 0;

    font-size: 16px;

    line-height: 1.4;

    color: #56515a;

    word-break: break-word;
}


/* =========================================
   EMPTY STATE
========================================= */

.empty {

    text-align: center;

    padding:
        50px
        20px;

    color: #aaa4ae;
}


.empty-icon {

    font-size: 40px;

    margin-bottom: 12px;
}


.empty-title {

    font-size: 16px;

    color: #96909a;
}


.empty-subtitle {

    margin-top: 5px;

    font-size: 12px;

    color: #b0aab3;
}


/* =========================================
   COUNTER
========================================= */

.counter {

    text-align: center;

    margin-top: 12px;

    font-size: 10px;

    letter-spacing: 1.5px;

    color: #aaa4ae;

    text-transform: uppercase;
}


/* =========================================
   SMALL PHONES
========================================= */

@media (max-width: 370px) {

    .title {
        font-size: 30px;
    }

    .category-name {
        font-size: 12px;
    }

    .task-input {
        font-size: 15px;
    }

    .task-text {
        font-size: 15px;
    }

}


/* =========================================
   LANDSCAPE
========================================= */

@media (orientation: landscape) {

    .app {

        padding-top: 20px;

        overflow-y: auto;
    }

    .task-list {

        max-height:
            calc(
                100dvh - 240px
            );
    }

}



/* =========================================
   SHARED / REFRESH
========================================= */

.shared-badge {
    display: inline-block;
    margin-left: 4px;
    font-size: 10px;
}

.refresh-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
}

.refresh-button {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: 1px solid rgba(120,110,130,0.12);
    border-radius: 14px;
    background: rgba(255,255,255,0.78);
    color: #766b7c;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(100,90,110,0.06);
    transition: transform .4s ease, background .2s ease;
}

.refresh-button.refreshing {
    transform: rotate(360deg);
}

.refresh-button:disabled {
    opacity: .6;
}

.shared-search {
    flex: 1;
    min-width: 0;
    padding: 13px 15px;
    border: 1px solid #e1dbe5;
    border-radius: 16px;
    outline: none;
    background: rgba(255,255,255,.78);
    color: #514d55;
    font-family: inherit;
    font-size: 15px;
    box-shadow: 0 6px 18px rgba(100,90,110,.05);
}

.shared-search:focus {
    border-color: #cfc1d8;
    background: rgba(255,255,255,.92);
}

.shared-search::placeholder {
    color: #b7b1ba;
}

.task-actions {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
}

.task-action {
    width: 31px;
    height: 31px;
    border: none;
    border-radius: 10px;
    background: #f0eaf3;
    color: #766b7c;
    font-size: 14px;
    padding: 0;
}

.task-action.delete {
    background: #f5e2e5;
    color: #9a6870;
}

.task-shared {
    align-items: flex-start;
}

.task-main {
    flex: 1;
    min-width: 0;
}

.task-note {
    margin-top: 5px;
    font-size: 12px;
    line-height: 1.4;
    color: #9a929e;
    white-space: pre-wrap;
    word-break: break-word;
}

.completed-section {
    margin-top: 22px;
}

.completed-title {
    margin-bottom: 8px;
    font-size: 10px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #aaa4ae;
}

.task.completed {
    opacity: .82;
}

.task.completed .task-text {
    text-decoration: line-through;
    color: #96909a;
}

.resolution-box {
    margin-top: 7px;
    padding: 10px 11px;
    border-radius: 12px;
    background: #f3eee8;
    color: #81756f;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
}

.resolution-label {
    margin-bottom: 3px;
    font-size: 9px;
    font-weight: 750;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #a0958f;
}

.login-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(50,45,55,.38);
    backdrop-filter: blur(8px);
    padding: calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 20px);
    align-items: center;
    justify-content: center;
}

.login-overlay.visible {
    display: flex;
}

.login-card {
    width: 100%;
    max-width: 390px;
    padding: 25px;
    border-radius: 25px;
    background: rgba(255,255,255,.94);
    box-shadow: 0 20px 60px rgba(60,50,70,.22);
}

.login-card h2 {
    margin: 0 0 7px;
    color: #514c58;
    font-size: 22px;
}

.login-card p {
    margin: 0 0 18px;
    color: #9993a0;
    font-size: 12px;
    line-height: 1.45;
}

.login-card .input {
    width: 100%;
    padding: 14px;
    margin-bottom: 9px;
    border: 1px solid #e1dbe5;
    border-radius: 14px;
    outline: none;
    background: #fff;
    color: #514d55;
    font-family: inherit;
    font-size: 15px;
}

.login-card button {
    width: 100%;
    padding: 14px;
    margin-top: 4px;
    border: none;
    border-radius: 14px;
    background: #d9c7e8;
    color: #564a60;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
}

.login-close {
    margin-top: 9px !important;
    background: #eee9f0 !important;
    color: #716975 !important;
}

.login-error {
    min-height: 17px;
    margin-top: 9px;
    color: #bd7882;
    font-size: 12px;
    text-align: center;
}


/* SHARED 2 — COMPACT IMPORTANT CARDS */
.important-task-card{display:flex;align-items:flex-start;gap:11px;width:100%;padding:14px;margin-bottom:8px;border:1px solid rgba(150,135,150,.10);border-radius:17px;background:rgba(255,255,255,.78);box-shadow:0 5px 16px rgba(100,90,110,.05);cursor:pointer;transition:transform .12s ease,background .15s ease}
.important-task-card:active{transform:scale(.99)}
.important-task-card.completed-card{background:rgba(250,248,246,.76)}
.important-task-content{flex:1;min-width:0}
.important-task-title{font-size:15px;line-height:1.35;font-weight:680;color:#514d55;word-break:break-word}
.completed-card .important-task-title{color:#918b94;text-decoration:line-through}
.important-task-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.important-meta-pill{display:inline-flex;align-items:center;padding:4px 7px;border-radius:8px;background:#f1ebf3;color:#938997;font-size:9px;line-height:1;font-weight:650}
.completed-card .important-meta-pill{background:#eeeae8;color:#9c9590}
.important-task-detail{display:none;margin-top:13px;padding-top:12px;border-top:1px solid #eee7ec}
.important-task-card.expanded .important-task-detail{display:block}
.important-detail-block{margin-bottom:11px}
.important-detail-block:last-child{margin-bottom:0}
.important-detail-label{margin-bottom:4px;font-size:9px;font-weight:750;letter-spacing:1px;text-transform:uppercase;color:#a29aa5}
.important-detail-text{color:#6e666f;font-size:13px;line-height:1.48;white-space:pre-wrap;word-break:break-word}
.important-detail-empty{color:#b0a9b1;font-size:12px;font-style:italic}
.important-card-chevron{flex-shrink:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-top:1px;border-radius:7px;background:#f2edf4;color:#918695;font-size:11px;transition:transform .15s ease}
.important-task-card.expanded .important-card-chevron{transform:rotate(180deg)}
.important-task-actions{display:flex;gap:5px;margin-top:12px}
.important-task-actions .task-action{width:34px;height:34px}
.important-completed-heading{display:flex;align-items:center;gap:7px;margin:22px 2px 9px;font-size:10px;font-weight:750;letter-spacing:1.3px;text-transform:uppercase;color:#aaa2a9}
.important-completed-heading:before{content:"";width:5px;height:5px;border-radius:50%;background:#cdbfc9}

.task-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 250;
    background: rgba(50,45,55,.38);
    backdrop-filter: blur(8px);
    padding: calc(env(safe-area-inset-top) + 15px) 15px calc(env(safe-area-inset-bottom) + 15px);
    overflow-y: auto;
    align-items: center;
    justify-content: center;
}

.task-modal.visible {
    display: flex;
}

.task-modal-card {
    width: 100%;
    max-width: 500px;
    padding: 22px;
    border-radius: 25px;
    background: #fffafc;
    box-shadow: 0 20px 60px rgba(60,50,70,.22);
}

.task-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
}

.task-modal-title {
    font-size: 22px;
    font-weight: 750;
    color: #514c58;
}

.task-modal-close {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: #eee8ef;
    color: #706774;
    font-size: 20px;
}

.task-modal-label {
    display: block;
    margin: 13px 0 6px;
    font-size: 10px;
    font-weight: 750;
    color: #9a929e;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.task-modal-input,
.task-modal-textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #e1dbe5;
    border-radius: 14px;
    outline: none;
    background: #fff;
    color: #514d55;
    font-family: inherit;
    font-size: 15px;
}

.task-modal-textarea {
    min-height: 95px;
    resize: vertical;
}

.task-modal-save {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: none;
    border-radius: 15px;
    background: #cfe5d9;
    color: #4f6657;
    font-family: inherit;
    font-size: 15px;
    font-weight: 750;
}

@media (max-width: 370px) {
    .refresh-button {
        width: 39px;
        height: 39px;
    }
}
</style>

</head>


<body>

<div class="app">
<div class="content">

<div class="header">

    <div class="icon">🌸</div>

    <h1 class="title">
        To-Do List
    </h1>

    <div class="subtitle">
        Keep it simple. Get it done.
    </div>

</div>


<div class="category-bar" id="categoryBar"></div>

<div class="category-editor" id="categoryEditor">

    <input
        class="category-input"
        id="categoryInput"
        type="text"
        maxlength="30"
        autocomplete="off">

    <button
        class="category-save"
        onclick="saveCategoryName()">
        Save
    </button>

</div>

<div class="category-hint" id="categoryHint">
    Tap a personal list again to rename it
</div>

<div class="current-category" id="currentCategory"></div>

<div id="sharedControls"></div>

<div class="add-card">

    <input
        class="task-input"
        id="taskInput"
        type="text"
        placeholder="Add something..."
        autocomplete="off"
        maxlength="200">

    <button
        class="add-button"
        onclick="addTask()">
        +
    </button>

</div>

<div class="task-list" id="taskList"></div>

<div class="counter" id="counter"></div>

</div>
</div>


<!-- LOGIN FOR SHARED LISTS -->

<div
    class="login-overlay"
    id="loginOverlay">

    <div class="login-card">

        <h2>Shared To-Do Lists</h2>

        <p>
            Log in with your recipe-book account to access
            Shared 1 and Shared 2.
        </p>

        <input
            id="loginEmail"
            class="input"
            type="email"
            placeholder="Email"
            autocomplete="email">

        <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="Password"
            autocomplete="current-password">

        <button onclick="loginForShared()">
            Log in
        </button>

        <button
            class="login-close"
            onclick="closeLogin()">
            Cancel
        </button>

        <div
            id="loginError"
            class="login-error">
        </div>

    </div>
</div>


<!-- IMPORTANT SHARED TASK EDITOR -->

<div
    class="task-modal"
    id="taskModal">

    <div class="task-modal-card">

        <div class="task-modal-header">

            <div
                class="task-modal-title"
                id="taskModalTitle">
                Important Task
            </div>

            <button
                class="task-modal-close"
                onclick="closeTaskModal()">
                ×
            </button>

        </div>

        <label class="task-modal-label">
            Task
        </label>

        <input
            id="sharedTaskTitle"
            class="task-modal-input"
            maxlength="200"
            placeholder="What needs to be done?">

        <label class="task-modal-label">
            Notes
        </label>

        <textarea
            id="sharedTaskNote"
            class="task-modal-textarea"
            placeholder="Additional information..."></textarea>

        <label
            class="task-modal-label"
            id="resolutionLabel">
            Resolution
        </label>

        <textarea
            id="sharedTaskResolution"
            class="task-modal-textarea"
            placeholder="What was the outcome?"></textarea>

        <button
            class="task-modal-save"
            onclick="saveSharedTask()">
            Save Task
        </button>

    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =

/* =========================================
   LOCAL PERSONAL STORAGE
========================================= */

function loadData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if (!saved) {
        saveData();
        return;
    }

    try {

        const parsed =
            JSON.parse(saved);

        if (
            parsed &&
            Array.isArray(parsed.categories) &&
            parsed.categories.length === 2
        ) {

            data = parsed;

        } else {

            saveData();

        }

    } catch {

        saveData();

    }
}


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =========================================
   AUTH / SHARED ACCESS
========================================= */

async function getCurrentSession() {

    const result =
        await supabaseClient.auth.getSession();

    if (
        result.data &&
        result.data.session
    ) {

        currentUser =
            result.data.session.user;

        return true;
    }

    currentUser = null;

    return false;
}


async function ensureSharedAccess() {

    if (!currentUser) {

        const hasSession =
            await getCurrentSession();

        if (!hasSession) {
            return false;
        }
    }

    const result =
        await supabaseClient
        .from("todo_space_members")
        .select("space_id")
        .eq(
            "space_id",
            SHARED_SPACE_ID
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .maybeSingle();

    if (
        result.error ||
        !result.data
    ) {

        console.error(
            "Shared access check failed:",
            result.error
        );

        return false;
    }

    sharedReady = true;

    return true;
}

    error.textContent = "";

    if (!email || !password) {

            "Please enter your email and password.";

        return;
    }

    const result =
        await supabaseClient.auth
        .signInWithPassword({
            email,
            password
        });

    if (result.error) {

        error.textContent =
            result.error.message;

        return;
    }

    currentUser =
        result.data.user;

    const access =
        await ensureSharedAccess();

    if (!access) {

        error.textContent =
            "This account is not connected to the shared To-Do list.";

        return;
    }

    closeLogin();

    await loadSharedTasks();

    setupRealtime();

    renderCategories();
    renderTasks();

/* =========================================
   CATEGORY RENDERING
========================================= */

function renderCategories() {

    const bar =
        document.getElementById(
            "categoryBar"
        );

    bar.innerHTML = "";

    const categories = [
        {
            name: data.categories[0].name,
            type: "personal",
            index: 0
        },
        {
            name: data.categories[1].name,
            type: "personal",
            index: 1
        },
        {
            name: "Shared 1",
            type: "shared",
            index: 2
        },
        {
            name: "Shared 2",
            type: "shared",
            index: 3
        }
    ];

    categories.forEach(
        category => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "category";

            if (
                category.index ===
                selectedCategory
            ) {

                element.classList.add(
                    "selected"
                );

            }

            element.innerHTML = `

                <div class="category-name">

                    ${
                        category.type === "shared"
                        ? "👥 "
                        : ""
                    }

                    ${escapeHtml(
                        category.name
                    )}

                </div>

                <div class="category-count">

                    ${getCategoryCount(
                        category.index
                    )}

                </div>

            `;

            element.onclick =
                async function() {

                    if (
                        category.type ===
                        "shared"
                    ) {

                        selectedCategory =
                            category.index;

                        closeCategoryEditor();

                        renderCategories();

                        const access =
                            await ensureSharedAccess();

                        if (!access) {

                            document.getElementById(
                                "loginOverlay"
                            ).classList.add(
                                "visible"
                            );

                            renderTasks();

                            return;
                        }

                        await loadSharedTasks();

                        setupRealtime();

                        renderTasks();

                        return;
                    }


                    selectedCategory =
                        category.index;

                    closeCategoryEditor();

                    renderCategories();

                    renderTasks();

                };

            bar.appendChild(
                element
            );

        }
    );
}


function getCategoryCount(index) {

    if (index < 2) {

        return data.categories[index]
            .tasks.length;

    }

    if (!sharedReady) {

        return "shared";

    }

    const listType =
        index === 2
        ? "shared1"
        : "shared2";

    const tasks =
        sharedTasks.filter(
            task =>
                task.list_type ===
                listType
        );

    if (index === 3) {

        const active =
            tasks.filter(
                task =>
                    !task.completed
            ).length;

        const completed =
            tasks.filter(
                task =>
                    task.completed
            ).length;

        return (
            active
            +
            " open • "
            +
            completed
            +
            " done"
        );

    }

    return tasks.filter(
        task =>
            !task.completed
    ).length
    +
    " open";

}

function addTask() {

    const input =
        document.getElementById(
            "taskInput"
        );

    const text =
        input.value.trim();

    if (!text) {

        input.focus();

        return;
    }


    if (selectedCategory < 2) {

        data.categories[
            selectedCategory
        ].tasks.push({

            id: Date.now(),
            text

        });

        saveData();

        input.value = "";
        input.focus();

        renderCategories();
        renderTasks();

        return;
    }


    if (
        selectedCategory === 2
    ) {

        addSharedTaskSimple(
            text
        );

        return;
    }


    openImportantTaskModal(
        null,
        text
    );

}


/* =========================================
   SHARED TASK LOAD
========================================= */

async function loadSharedTasks() {

    if (
        !currentUser ||
        !sharedReady
    ) {
        return;
    }

    const result =
        await supabaseClient
        .from("todo_tasks")
        .select("*")
        .eq(
            "space_id",
            SHARED_SPACE_ID
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );

    if (result.error) {

        console.error(
            "Could not load shared tasks:",
            result.error
        );

        return;
    }

    sharedTasks =
        result.data || [];

    if (
        selectedCategory >= 2
    ) {

        renderCategories();
        renderTasks();

    }

}

async function saveSharedTask() {

    if (!await ensureSharedAccess()) {
        return;
    }

    const title =
        document.getElementById(
            "sharedTaskTitle"
        ).value.trim();

    const note =
        document.getElementById(
            "sharedTaskNote"
        ).value.trim();

    const resolution =
        document.getElementById(
            "sharedTaskResolution"
        ).value.trim();

    if (!title) {

        return;
    }

    const payload = {

        space_id:
            SHARED_SPACE_ID,

        list_type:
            "shared2",

        title,
        note,
        resolution,

        updated_at:
            new Date().toISOString()

    };

    let result;

    if (editingSharedTaskId) {

        result =
            await supabaseClient
            .from("todo_tasks")
            .update(payload)
            .eq(
                "id",
                editingSharedTaskId
            );

    } else {

        payload.created_by =
            currentUser.id;

        result =
            await supabaseClient
            .from("todo_tasks")
            .insert(
                payload
            );

    }

    if (result.error) {

        alert(
            "Could not save the important task:\n\n"
            +
            result.error.message
        );

        return;
    }

    closeTaskModal();

    document.getElementById(
        "taskInput"
    ).value = "";

    await loadSharedTasks();

}


/* =========================================
   COMPLETE SHARED TASK
========================================= */

async function completeSharedTask(
    task
) {

    if (!await ensureSharedAccess()) {
        return;
    }


    if (
        task.list_type ===
        "shared1"
    ) {

        const result =
            await supabaseClient
            .from("todo_tasks")
            .delete()
            .eq(
                "id",
                task.id
            );

        if (result.error) {

            alert(
                "Could not complete the shared task:\n\n"
                +
                result.error.message
            );

            return;
        }

    } else {

        const result =
            await supabaseClient
            .from("todo_tasks")
            .update({

                completed:
                    true,

                completed_at:
                    new Date().toISOString(),

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                task.id
            );

        if (result.error) {

            alert(
                "Could not complete the important task:\n\n"
                +
                result.error.message
            );

            return;
        }

    }


    await loadSharedTasks();

}

/* =========================================
   RENDER TASKS
========================================= */

function renderTasks() {

    const container =
        document.getElementById(
            "taskList"
        );

    const current =
        document.getElementById(
            "currentCategory"
        );

    const controls =
        document.getElementById(
            "sharedControls"
        );

    /*
     * Shared 2 search is inside sharedControls.
     * Save its current value before rebuilding the
     * controls, otherwise oninput would destroy the
     * input and reset the search on every keystroke.
     */
    const existingSearch =
        document.getElementById(
            "sharedSearch"
        );

    const preservedSearch =
        existingSearch
        ? existingSearch.value
        : "";

    const searchHadFocus =
        existingSearch &&
        document.activeElement === existingSearch;

    container.innerHTML = "";
    controls.innerHTML = "";

    if (selectedCategory < 2) {

        const category =
            data.categories[
                selectedCategory
            ];

        current.textContent =
            category.name;

        document.getElementById(
            "categoryHint"
        ).textContent =
            "Tap the selected category again to rename it";

        document.getElementById(
            "taskInput"
        ).placeholder =
            "Add something...";

        category.tasks.forEach(
            task => {

                appendPersonalTask(
                    container,
                    task
                );

            }
        );

        if (
            category.tasks.length === 0
        ) {

            renderEmpty(
                container,
                "✨",
                "Nothing here yet",
                "Add something you want to get done."
            );

        }

        updateCounter(
            category.tasks.length
        );

        return;
    }


    if (!sharedReady) {

        current.textContent =
            selectedCategory === 2
            ? "Shared 1"
            : "Shared 2";

        document.getElementById(
            "categoryHint"
        ).textContent =
            "Log in to use the shared lists";

        document.getElementById(
            "taskInput"
        ).placeholder =
            "Log in to add a shared task";

        document.getElementById(
            "taskInput"
        ).disabled =
            true;

        updateCounter(0);

        renderEmpty(
            container,
            "🔐",
            "Shared list locked",
            "Tap Shared 1 or Shared 2 and log in."
        );

        return;
    }


    document.getElementById(
        "taskInput"
    ).disabled =
        false;

    const listType =
        selectedCategory === 2
        ? "shared1"
        : "shared2";

    current.textContent =
        selectedCategory === 2
        ? "Shared 1"
        : "Shared 2 • Important";

    document.getElementById(
        "categoryHint"
    ).textContent =
        "Shared between both phones";


    /* Shared 2 has search + refresh */

    if (
        selectedCategory === 3
    ) {

        controls.innerHTML = `

            <div class="refresh-row">

                <input
                    id="sharedSearch"
                    class="shared-search"
                    type="search"
                    placeholder="🔍 Search important tasks..."
                    value="${escapeHtml(preservedSearch)}"
                    oninput="renderTasks()">

                <button
                    id="refreshButton"
                    class="refresh-button"
                    type="button"
                    onclick="manualRefresh()"
                    aria-label="Refresh shared tasks"
                    title="Refresh shared tasks">
                    ↻
                </button>

            </div>

        `;

    } else {

        controls.innerHTML = `

            <div class="refresh-row">

                <div></div>

                <button
                    id="refreshButton"
                    class="refresh-button"
                    type="button"
                    onclick="manualRefresh()"
                    aria-label="Refresh shared tasks"
                    title="Refresh shared tasks">
                    ↻
                </button>

            </div>

        `;

    }


    /*
     * renderTasks() rebuilds the search input after every
     * keystroke. Restore focus so iPhone users can keep
     * typing without tapping the field again.
     */

    if (
        selectedCategory === 3 &&
        searchHadFocus
    ) {

        const newSearch =
            document.getElementById(
                "sharedSearch"
            );

        if (newSearch) {

            requestAnimationFrame(
                function() {

                    newSearch.focus();

                    try {

                        newSearch.setSelectionRange(
                            newSearch.value.length,
                            newSearch.value.length
                        );

                    } catch {}

                }
            );

        }

    }


    const searchElement =
        document.getElementById(
            "sharedSearch"
        );

    const search =
        searchElement
        ? searchElement.value
            .trim()
            .toLowerCase()
        : "";


    const listTasks =
        sharedTasks.filter(
            task =>
                task.list_type ===
                listType
        );


    const activeTasks =
        listTasks.filter(
            task =>
                !task.completed
        );

    const completedTasks =
        listTasks.filter(
            task =>
                task.completed
        );


    let visibleActive =
        activeTasks;

    if (
        selectedCategory === 3 &&
        search
    ) {

        visibleActive =
            activeTasks.filter(
                task =>
                    (
                        task.title
                        +
                        " "
                        +
                        (task.note || "")
                        +
                        " "
                        +
                        (task.resolution || "")
                    )
                    .toLowerCase()
                    .includes(search)
            );

    }


    if (
        visibleActive.length === 0
    ) {

        renderEmpty(
            container,
            selectedCategory === 3
            ? "⭐"
            : "🤝",
            search
            ? "Nothing found"
            : "Nothing here yet",
            search
            ? "Try a different search."
            : "Add something you want to get done."
        );

    } else {

        visibleActive.forEach(
            task => {

                appendSharedTask(
                    container,
                    task,
                    false
                );

            }
        );

    }


    if (
        selectedCategory === 3
    ) {

        const visibleCompleted =
            search
            ? completedTasks.filter(
                task =>
                    (
                        task.title
                        +
                        " "
                        +
                        (task.note || "")
                        +
                        " "
                        +
                        (task.resolution || "")
                    )
                    .toLowerCase()
                    .includes(search)
            )
            : completedTasks;

        if (
            visibleCompleted.length
        ) {

            const section =
                document.createElement(
                    "div"
                );

            section.className =
                "completed-section";

            section.innerHTML = `
                <div class="important-completed-heading">
                    Completed history
                </div>
            `;

            container.appendChild(
                section
            );

            visibleCompleted.forEach(
                task => {

                    appendSharedTask(
                        container,
                        task,
                        true
                    );

                }
            );

        }

    }


    updateCounter(
        activeTasks.length
    );

}


/* =========================================
   PERSONAL TASK
========================================= */

function appendPersonalTask(
    container,
    task
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "task";

    element.innerHTML = `

        <button
            class="checkbox"
            aria-label="Complete task">

            <span class="checkmark">
                ✓
            </span>

        </button>

        <div class="task-text">
            ${escapeHtml(task.text)}
        </div>

    `;

    const checkbox =
        element.querySelector(
            ".checkbox"
        );

    checkbox.onclick =
        function() {

            checkbox.style.background =
                "#dcefe5";

            checkbox.style.borderColor =
                "#a9cfbb";

            const checkmark =
                checkbox.querySelector(
                    ".checkmark"
                );

            checkmark.style.opacity =
                "1";

            checkmark.style.transform =
                "scale(1)";

            setTimeout(
                function() {

                    data.categories[
                        selectedCategory
                    ].tasks =
                        data.categories[
                            selectedCategory
                        ].tasks.filter(
                            item =>
                                item.id !==
                                task.id
                        );

                    saveData();

                    renderCategories();
                    renderTasks();

                },
                180
            );

        };

    container.appendChild(
        element
    );

}


/* =========================================
   SHARED TASK CARD
========================================= */

function appendSharedTask(container, task, completed) {

    if (task.list_type !== "shared2") {

        const element = document.createElement("div");
        element.className = completed ? "task task-shared completed" : "task task-shared";

        element.innerHTML = `
            <button class="checkbox" aria-label="${completed ? "Reopen task" : "Complete task"}">
                <span class="checkmark" style="${completed ? "opacity:1;transform:scale(1);" : ""}">✓</span>
            </button>
            <div class="task-main"><div class="task-text">${escapeHtml(task.title)}</div></div>
            <div class="task-actions">
                <button class="task-action" type="button" title="Edit">✏️</button>
                <button class="task-action delete" type="button" title="Delete">🗑️</button>
            </div>`;

        element.querySelector(".checkbox").onclick = () => completeSharedTask(task);
        const buttons = element.querySelectorAll(".task-action");
        buttons[0].onclick = () => editShared1Task(task);
        buttons[1].onclick = () => deleteSharedTask(task);
        container.appendChild(element);
        return;
    }

    const element = document.createElement("div");
    element.className = "important-task-card" + (completed ? " completed-card" : "");

    const pills = `
        ${task.note ? '<span class="important-meta-pill">📝 Note</span>' : ""}
        ${task.resolution ? '<span class="important-meta-pill">✓ Resolution</span>' : ""}
        ${completed ? '<span class="important-meta-pill">✓ Completed</span>' : ""}
    `;

    const noteBlock = task.note ? `
        <div class="important-detail-block">
            <div class="important-detail-label">Note</div>
            <div class="important-detail-text">${escapeHtml(task.note)}</div>
        </div>` : "";

    const resolutionBlock = completed ? `
        <div class="important-detail-block">
            <div class="important-detail-label">Resolution</div>
            <div class="${task.resolution ? "important-detail-text" : "important-detail-empty"}">
                ${task.resolution ? escapeHtml(task.resolution) : "No resolution added yet."}
            </div>
        </div>` : "";

    element.innerHTML = `
        <button class="checkbox" aria-label="${completed ? "Reopen task" : "Complete task"}">
            <span class="checkmark" style="${completed ? "opacity:1;transform:scale(1);" : ""}">✓</span>
        </button>

        <div class="important-task-content">
            <div class="important-task-title">${escapeHtml(task.title)}</div>
            <div class="important-task-meta">${pills}</div>

            <div class="important-task-detail">
                ${noteBlock}
                ${resolutionBlock}
                <div class="important-task-actions">
                    <button class="task-action" type="button" title="Edit">✏️</button>
                    <button class="task-action delete" type="button" title="Delete">🗑️</button>
                </div>
            </div>
        </div>

        <div class="important-card-chevron" aria-hidden="true">▼</div>
    `;

    element.onclick = () => element.classList.toggle("expanded");

    element.querySelector(".checkbox").onclick = (event) => {
        event.stopPropagation();
        completed ? reopenImportantTask(task) : completeSharedTask(task);
    };

    const buttons = element.querySelectorAll(".task-action");
    buttons[0].onclick = (event) => {
        event.stopPropagation();
        openImportantTaskModal(task);
    };
    buttons[1].onclick = (event) => {
        event.stopPropagation();
        deleteSharedTask(task);
    };

    container.appendChild(element);
}

/* =========================================
   EDIT SHARED 1
========================================= */

async function editShared1Task(
    task
) {

    const newTitle =
        prompt(
            "Edit task:",
            task.title
        );

    if (
        newTitle === null
    ) {
        return;
    }

    const title =
        newTitle.trim();

    if (!title) {
        return;
    }

    const result =
        await supabaseClient
        .from("todo_tasks")
        .update({

            title,

            updated_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            task.id
        );

    if (result.error) {

        alert(
            result.error.message
        );

        return;
    }

    await loadSharedTasks();

}


/* =========================================
   REFRESH
========================================= */

async function manualRefresh() {

    if (
        refreshInProgress ||
        !currentUser ||
        !sharedReady
    ) {
        return;
    }

    const button =
        document.getElementById(
            "refreshButton"
        );

    refreshInProgress = true;

    if (button) {

        button.classList.add(
            "refreshing"
        );

        button.disabled = true;

    }

    try {

        await loadSharedTasks();

    } catch (error) {

        console.error(
            "Manual refresh failed:",
            error
        );

    } finally {

        setTimeout(
            function() {

                if (button) {

                    button.classList.remove(
                        "refreshing"
                    );

                    button.disabled = false;

                }

                refreshInProgress = false;

            },
            450
        );

    }

}


/* =========================================
   AUTOMATIC REFRESH ON APP RESUME
========================================= */

document.addEventListener(
    "visibilitychange",
    async function() {

        if (
            document.visibilityState !==
            "visible"
        ) {
            return;
        }

        if (
            selectedCategory < 2 ||
            !currentUser ||
            !sharedReady
        ) {
            return;
        }

        const now =
            Date.now();

        if (
            now -
            lastVisibilityRefresh
            <
            3000
        ) {
            return;
        }

        lastVisibilityRefresh =
            now;

        await loadSharedTasks();

    }
);


/* =========================================
   REALTIME
========================================= */

function setupRealtime() {

    if (
        !currentUser ||
        !sharedReady
    ) {
        return;
    }

    if (realtimeChannel) {
        return;
    }

    realtimeChannel =
        supabaseClient
        .channel(
            "todo-book-live"
        )
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "todo_tasks",
                filter:
                    "space_id=eq."
                    +
                    SHARED_SPACE_ID
            },
            async function() {

                await loadSharedTasks();

            }
        )
        .subscribe();

}


/* =========================================
   EMPTY STATE
========================================= */

function renderEmpty(
    container,
    icon,
    title,
    subtitle
) {

    container.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                ${icon}
            </div>

            <div class="empty-title">
                ${escapeHtml(title)}
            </div>

            <div class="empty-subtitle">
                ${escapeHtml(subtitle)}
            </div>

        </div>

    `;

}


/* =========================================
   COUNTER
========================================= */

function updateCounter(
    count
) {

    const counter =
        document.getElementById(
            "counter"
        );

    if (
        count === 0
    ) {

        counter.textContent = "";

        return;
    }

    counter.textContent =
        count
        +
        (
            count === 1
            ? " task remaining"
            : " tasks remaining"
        );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* =========================================
   ENTER KEYS
========================================= */

document.getElementById(
    "taskInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            addTask();

        }

    }
);

document.getElementById(
    "categoryInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            saveCategoryName();

        }

    }
);

document.getElementById(
    "loginPassword"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            loginForShared();

        }

    }
);

document.getElementById(
    "sharedTaskTitle"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();
            saveSharedTask();

        }

    }
);


/* =========================================
   START
========================================= */

loadData();

renderCategories();

renderTasks();

getCurrentSession()
    .then(
        function(hasSession) {

            if (hasSession) {

                ensureSharedAccess()
                    .then(
                        function(access) {

                            if (access) {

                                setupRealtime();

                                if (
                                    selectedCategory >= 2
                                ) {

                                    loadSharedTasks();

                                }

                            }

                        }
                    );

            }

        }
    );

</script>
