<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#f8f5fb">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="default">

<meta name="apple-mobile-web-app-title"
content="To-Do List">

<title>To-Do List</title>


<style>

/* =========================================
   BASIC
========================================= */

* {
    box-sizing: border-box;
}

html {

    width: 100%;
    height: 100%;

    background: #f8f5fb;
}

body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background:
        linear-gradient(
            145deg,
            #fdf9fc 0%,
            #f4f0fa 45%,
            #eef5f4 100%
        );

    color: #45424a;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;

    overflow: hidden;
}


/* =========================================
   APP
========================================= */

.app {

    width: 100%;

    min-height: 100dvh;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    padding:
        calc(env(safe-area-inset-top) + 30px)
        18px
        calc(env(safe-area-inset-bottom) + 20px)
        18px;
}


.content {

    width: 100%;

    max-width: 540px;
}


/* =========================================
   HEADER
========================================= */

.header {

    text-align: center;

    margin-bottom: 24px;
}


.icon {

    font-size: 42px;

    line-height: 1;

    margin-bottom: 12px;
}


.title {

    margin: 0;

    font-size: 34px;

    font-weight: 750;

    letter-spacing: -0.5px;

    color: #514c58;
}


.subtitle {

    margin-top: 7px;

    font-size: 12px;

    color: #9993a0;

    letter-spacing: 1.5px;
}


/* =========================================
   CATEGORY BAR
========================================= */

.category-bar {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-bottom: 14px;
}


.category {

    min-width: 0;

    padding:
        14px
        7px;

    border-radius: 17px;

    border:
        1px solid
        rgba(120,110,130,0.10);

    background:
        rgba(255,255,255,0.72);

    color: #9a95a0;

    text-align: center;

    cursor: pointer;

    box-shadow:
        0 5px 18px
        rgba(100,90,110,0.06);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}


.category.selected {

    color: #5e5865;

    box-shadow:
        0 7px 22px
        rgba(100,90,110,0.10);

    border-color:
        rgba(120,110,130,0.20);
}


/*
   Individual pastel accents
*/

.category:nth-child(1).selected {

    background: #eee5fa;
}


.category:nth-child(2).selected {

    background: #e4f1f8;
}


.category:nth-child(3).selected {

    background: #e4f4ed;
}


.category:active {

    transform:
        scale(0.96);
}


.category-name {

    font-size: 13px;

    font-weight: 650;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.category-count {

    margin-top: 5px;

    font-size: 9px;

    color: #aaa5af;

    letter-spacing: 0.5px;
}


/* =========================================
   CATEGORY EDITOR
========================================= */

.category-editor {

    display: none;

    margin-bottom: 12px;

    gap: 7px;
}


.category-editor.visible {

    display: flex;
}


.category-input {

    flex: 1;

    min-width: 0;

    padding:
        12px
        13px;

    border:
        1px solid
        #ddd6e3;

    border-radius: 14px;

    outline: none;

    background:
        rgba(255,255,255,0.85);

    color: #57515e;

    font-family: inherit;

    font-size: 14px;

    box-shadow:
        0 4px 15px
        rgba(100,90,110,0.05);
}


.category-input:focus {

    border-color:
        #cbbbdc;
}


.category-save {

    padding:
        0
        16px;

    border: none;

    border-radius: 14px;

    background: #ddd0ed;

    color: #51485c;

    font-weight: 650;

    font-family: inherit;
}


.category-save:active {

    transform:
        scale(0.96);
}


/* =========================================
   CATEGORY HINT
========================================= */

.category-hint {

    text-align: center;

    margin-bottom: 13px;

    font-size: 10px;

    color: #aaa4ae;
}


/* =========================================
   CURRENT CATEGORY
========================================= */

.current-category {

    margin-bottom: 9px;

    font-size: 11px;

    color: #aaa3af;

    letter-spacing: 1.2px;

    text-transform: uppercase;
}


/* =========================================
   ADD TASK
========================================= */

.add-card {

    display: flex;

    gap: 9px;

    margin-bottom: 15px;
}


.task-input {

    flex: 1;

    min-width: 0;

    padding:
        15px
        15px;

    border:
        1px solid
        #e1dbe5;

    border-radius: 17px;

    outline: none;

    background:
        rgba(255,255,255,0.78);

    color: #514d55;

    font-family: inherit;

    font-size: 16px;

    box-shadow:
        0 6px 22px
        rgba(100,90,110,0.06);
}


.task-input::placeholder {

    color: #b7b1ba;
}


.task-input:focus {

    border-color:
        #cfc1d8;

    background:
        rgba(255,255,255,0.92);
}


.add-button {

    width: 54px;

    border: none;

    border-radius: 17px;

    background: #d9c7e8;

    color: #564a60;

    font-size: 27px;

    cursor: pointer;

    box-shadow:
        0 6px 18px
        rgba(120,100,130,0.12);

    transition:
        transform 0.15s ease;
}


.add-button:active {

    transform:
        scale(0.93);
}


/* =========================================
   TASK LIST
========================================= */

.task-list {

    display: flex;

    flex-direction: column;

    gap: 9px;

    max-height:
        calc(
            100dvh - 290px
        );

    overflow-y: auto;

    padding-bottom: 20px;

    scrollbar-width: none;
}


.task-list::-webkit-scrollbar {

    display: none;
}


/* =========================================
   TASK
========================================= */

.task {

    display: flex;

    align-items: center;

    gap: 14px;

    padding:
        15px
        16px;

    border-radius: 18px;

    background:
        rgba(255,255,255,0.76);

    border:
        1px solid
        rgba(150,140,155,0.10);

    box-shadow:
        0 7px 22px
        rgba(100,90,110,0.06);

    animation:
        taskAppear 0.2s ease;
}


@keyframes taskAppear {

    from {

        opacity: 0;

        transform:
            translateY(5px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================
   CHECKBOX
========================================= */

.checkbox {

    width: 26px;

    height: 26px;

    flex-shrink: 0;

    border-radius: 50%;

    border:
        2px solid
        #c9bed1;

    background:
        #faf7fc;

    cursor: pointer;

    display: flex;

    justify-content: center;

    align-items: center;

    transition:
        background 0.15s ease,
        border 0.15s ease,
        transform 0.15s ease;
}


.checkbox:active {

    transform:
        scale(0.88);
}


.checkmark {

    font-size: 15px;

    color: #65566e;

    opacity: 0;

    transform:
        scale(0.5);

    transition:
        opacity 0.15s ease,
        transform 0.15s ease;
}


/* =========================================
   TASK TEXT
========================================= */

.task-text {

    flex: 1;

    min-width: 0;

    font-size: 16px;

    line-height: 1.4;

    color: #56515a;

    word-break: break-word;
}


/* =========================================
   EMPTY STATE
========================================= */

.empty {

    text-align: center;

    padding:
        50px
        20px;

    color: #aaa4ae;
}


.empty-icon {

    font-size: 40px;

    margin-bottom: 12px;
}


.empty-title {

    font-size: 16px;

    color: #96909a;
}


.empty-subtitle {

    margin-top: 5px;

    font-size: 12px;

    color: #b0aab3;
}


/* =========================================
   COUNTER
========================================= */

.counter {

    text-align: center;

    margin-top: 12px;

    font-size: 10px;

    letter-spacing: 1.5px;

    color: #aaa4ae;

    text-transform: uppercase;
}


/* =========================================
   SMALL PHONES
========================================= */

@media (max-width: 370px) {

    .title {
        font-size: 30px;
    }

    .category-name {
        font-size: 12px;
    }

    .task-input {
        font-size: 15px;
    }

    .task-text {
        font-size: 15px;
    }

}


/* =========================================
   LANDSCAPE
========================================= */

@media (orientation: landscape) {

    .app {

        padding-top: 20px;

        overflow-y: auto;
    }

    .task-list {

        max-height:
            calc(
                100dvh - 240px
            );
    }

}

</style>

</head>


<body>


<div class="app">


<div class="content">


<!-- ======================================
     HEADER
======================================= -->

<div class="header">


    <div class="icon">
        🌸
    </div>


    <h1 class="title">
        To-Do List
    </h1>


    <div class="subtitle">
        Keep it simple. Get it done.
    </div>


</div>


<!-- ======================================
     CATEGORIES
======================================= -->

<div
    class="category-bar"
    id="categoryBar">
</div>


<!-- ======================================
     CATEGORY EDITOR
======================================= -->

<div
    class="category-editor"
    id="categoryEditor">


    <input
        class="category-input"
        id="categoryInput"
        type="text"
        maxlength="30"
        autocomplete="off">


    <button
        class="category-save"
        onclick="saveCategoryName()">

        Save

    </button>


</div>


<div class="category-hint">
    Tap the selected category again to rename it
</div>


<!-- ======================================
     CURRENT CATEGORY
======================================= -->

<div
    class="current-category"
    id="currentCategory">
</div>


<!-- ======================================
     ADD TASK
======================================= -->

<div class="add-card">


    <input
        class="task-input"
        id="taskInput"
        type="text"
        placeholder="Add something..."
        autocomplete="off"
        maxlength="200">


    <button
        class="add-button"
        onclick="addTask()">

        +

    </button>


</div>


<!-- ======================================
     TASK LIST
======================================= -->

<div
    class="task-list"
    id="taskList">
</div>


<!-- ======================================
     COUNTER
======================================= -->

<div
    class="counter"
    id="counter">
</div>


</div>

</div>



<script>


/* =========================================
   STORAGE
========================================= */

const STORAGE_KEY =
    "vanessaTodoList_v2";


/* =========================================
   DEFAULT DATA
========================================= */

const defaultData = {

    categories: [

        {
            name: "To-do 1",
            tasks: []
        },

        {
            name: "To-do 2",
            tasks: []
        },

        {
            name: "To-do 3",
            tasks: []
        }

    ]

};


let data;

let selectedCategory = 0;


/* =========================================
   LOAD DATA
========================================= */

function loadData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!saved) {

        data =
            JSON.parse(
                JSON.stringify(
                    defaultData
                )
            );

        saveData();

        return;

    }


    try {

        data =
            JSON.parse(saved);


        if (
            !data.categories
            ||
            data.categories.length !== 3
        ) {

            data =
                JSON.parse(
                    JSON.stringify(
                        defaultData
                    )
                );

            saveData();

        }


    } catch {

        data =
            JSON.parse(
                JSON.stringify(
                    defaultData
                )
            );

        saveData();

    }

}


/* =========================================
   SAVE DATA
========================================= */

function saveData() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(data)

    );

}


/* =========================================
   RENDER CATEGORIES
========================================= */

function renderCategories() {

    const bar =
        document.getElementById(
            "categoryBar"
        );


    bar.innerHTML = "";


    data.categories.forEach(
        (category, index) => {


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "category";


            if (
                index ===
                selectedCategory
            ) {

                element.classList.add(
                    "selected"
                );

            }


            element.innerHTML = `

                <div class="category-name">
                    ${escapeHtml(category.name)}
                </div>

                <div class="category-count">
                    ${category.tasks.length}
                    ${
                        category.tasks.length === 1
                        ? "task"
                        : "tasks"
                    }
                </div>

            `;


            element.onclick =
                function() {


                    if (
                        index ===
                        selectedCategory
                    ) {

                        openCategoryEditor();

                        return;

                    }


                    selectedCategory =
                        index;


                    closeCategoryEditor();

                    renderCategories();

                    renderTasks();

                };


            bar.appendChild(
                element
            );

        }
    );

}


/* =========================================
   RENAME CATEGORY
========================================= */

function openCategoryEditor() {

    const editor =
        document.getElementById(
            "categoryEditor"
        );


    const input =
        document.getElementById(
            "categoryInput"
        );


    input.value =
        data.categories[
            selectedCategory
        ].name;


    editor.classList.add(
        "visible"
    );


    input.focus();

    input.select();

}


function closeCategoryEditor() {

    document.getElementById(
        "categoryEditor"
    ).classList.remove(
        "visible"
    );

}


/* =========================================
   SAVE CATEGORY NAME
========================================= */

function saveCategoryName() {

    const input =
        document.getElementById(
            "categoryInput"
        );


    const name =
        input.value.trim();


    if (!name) {

        return;

    }


    data.categories[
        selectedCategory
    ].name =
        name;


    saveData();

    closeCategoryEditor();

    renderCategories();

    renderTasks();

}


/* =========================================
   ADD TASK
========================================= */

function addTask() {

    const input =
        document.getElementById(
            "taskInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        input.focus();

        return;

    }


    data.categories[
        selectedCategory
    ].tasks.push({

        id:
            Date.now(),

        text:
            text

    });


    saveData();


    input.value = "";


    input.focus();


    renderCategories();

    renderTasks();

}


/* =========================================
   COMPLETE TASK
========================================= */

function completeTask(id) {

    const category =
        data.categories[
            selectedCategory
        ];


    category.tasks =
        category.tasks.filter(
            task =>
                task.id !== id
        );


    saveData();


    renderCategories();

    renderTasks();

}


/* =========================================
   RENDER TASKS
========================================= */

function renderTasks() {

    const container =
        document.getElementById(
            "taskList"
        );


    const category =
        data.categories[
            selectedCategory
        ];


    container.innerHTML = "";


    document.getElementById(
        "currentCategory"
    ).textContent =
        category.name;


    if (
        category.tasks.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ✨
                </div>

                <div class="empty-title">
                    Nothing here yet
                </div>

                <div class="empty-subtitle">
                    Add something you want to get done.
                </div>

            </div>

        `;


        updateCounter(0);

        return;

    }


    category.tasks.forEach(
        task => {


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "task";


            element.innerHTML = `

                <button
                    class="checkbox"
                    aria-label="Complete task">

                    <span
                        class="checkmark">
                        ✓
                    </span>

                </button>

                <div class="task-text">
                    ${escapeHtml(task.text)}
                </div>

            `;


            const checkbox =
                element.querySelector(
                    ".checkbox"
                );


            checkbox.onclick =
                function() {


                    checkbox.style.background =
                        "#dcefe5";


                    checkbox.style.borderColor =
                        "#a9cfbb";


                    const checkmark =
                        checkbox.querySelector(
                            ".checkmark"
                        );


                    checkmark.style.opacity =
                        "1";


                    checkmark.style.transform =
                        "scale(1)";


                    setTimeout(
                        function() {

                            completeTask(
                                task.id
                            );

                        },
                        180
                    );

                };


            container.appendChild(
                element
            );

        }
    );


    updateCounter(
        category.tasks.length
    );

}


/* =========================================
   COUNTER
========================================= */

function updateCounter(count) {

    const counter =
        document.getElementById(
            "counter"
        );


    if (
        count === 0
    ) {

        counter.textContent =
            "";

        return;

    }


    counter.textContent =

        count
        +
        (
            count === 1
            ? " task remaining"
            : " tasks remaining"
        );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================================
   ENTER KEY — TASK
========================================= */

document.getElementById(
    "taskInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            addTask();

        }

    }
);


/* =========================================
   ENTER KEY — CATEGORY
========================================= */

document.getElementById(
    "categoryInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            saveCategoryName();

        }

    }
);


/* =========================================
   INITIALIZE
========================================= */

loadData();

renderCategories();

renderTasks();

</script>


</body>

</html>
